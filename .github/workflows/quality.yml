name: Code Quality & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pre-commit
        run: |
          pip install pre-commit
          pre-commit install-hooks

      - name: Run Pre-commit Checks
        run: pre-commit run --all-files

      - name: Run Tests
        run: pnpm test --run

      - name: Code Coverage
        run: |
          pnpm test --run --coverage
          if [ -f coverage/coverage-summary.json ]; then
            coverage=$(jq '.total.lines.pct' coverage/coverage-summary.json 2>/dev/null || echo "0")
            echo "Coverage: ${coverage}%"
            if (( $(echo "$coverage < 80" | bc -l 2>/dev/null || echo "1") )); then
              echo "❌ Code coverage too low: ${coverage}% (minimum 80%)"
              exit 1
            fi
          fi

      - name: Security Audit
        run: pnpm audit --audit-level high

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage/coverage-summary.json
          fail_ci_if_error: false

      - name: Quality Metrics
        run: |
          echo "## Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "✅ All quality gates passed" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-commit checks: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Security audit: ✅" >> $GITHUB_STEP_SUMMARY
